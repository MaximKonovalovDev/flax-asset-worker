__provenance__: providers/ai_bridge.py + engine_bridge + extractor_bridge + runbooks — provider routing tables.
data:
  AI_PROVIDER_PROFILES:
    chatgpt_pro:
      provider_id: chatgpt_pro
      display_name: ChatGPT Pro
      asset_categories:
      - ui_hud
      - material
      output_formats:
      - png
      runtime_kind: cloud
      checklist:
      - Use ChatGPT Pro to iterate prompts or image outputs for UI and support textures.
      - Keep the chosen prompt chain in provenance notes.
      official_url: https://help.openai.com/en/articles/11128753
      access_surface: ChatGPT image workflow
      setup_steps:
      - Use a ChatGPT Pro workspace where image generation is enabled and keep runs in one thread per pack.
      - Start with one HUD element prompt at a time, then iterate through image edits instead of regenerating from scratch.
      - Export approved images to PNG and keep the prompt chain for provenance.
      progression_steps:
      - 'First pass: establish shape readability at gameplay scale.'
      - 'Second pass: lock line weight, contrast, and alpha edges for in-engine HUD readability.'
      - 'Final pass: only minor polish and naming before payload handoff.'
      notes: []
    google_pro:
      provider_id: google_pro
      display_name: Google Pro
      asset_categories:
      - ui_hud
      - material
      output_formats:
      - png
      runtime_kind: cloud
      checklist:
      - Use as a secondary cloud AI bridge when ChatGPT Pro is not landing the target look.
      - Keep the chosen prompt chain and accepted variants in provenance notes.
      official_url: https://ai.google.dev/gemini-api/docs/image-generation
      access_surface: Gemini image workflow
      setup_steps:
      - Use Gemini image generation in one thread per pack so prompt edits stay traceable.
      - Start with one readable HUD or texture-support element at a time.
      - Export approved images to PNG and keep the prompt chain for provenance.
      progression_steps:
      - Use this after ChatGPT Pro misses composition, material treatment, or cleanup quality.
      - Move accepted outputs into ComfyUI only for alpha cleanup, upscale, or remix work.
      notes: []
    hunyuan_image_colab:
      provider_id: hunyuan_image_colab
      display_name: HunyuanImage-3.0 Colab
      asset_categories:
      - ui_hud
      - material
      output_formats:
      - png
      runtime_kind: colab
      checklist:
      - Generate 2-4 clean variants and reject noisy outputs early.
      - Preserve prompt and seed/session notes for provenance.
      - Stage accepted PNG outputs into the reviewed payload target.
      official_url: https://github.com/Tencent-Hunyuan/HunyuanImage-3.0
      access_surface: Google Colab or local Linux notebook running HunyuanImage-3.0
      setup_steps:
      - Clone the official HunyuanImage repository and follow its setup instructions.
      - Keep batch size and resolution modest when running on T4-class GPUs.
      - Save accepted outputs as PNG and keep the prompt chain for provenance.
      progression_steps:
      - Use this lane for clean reference images when cloud UI generators miss the target style.
      - Prefer single-subject prompts with clear material and lighting intent.
      - When needed, generate 3-4 consistent angles for 3D pre-pass reference.
      notes:
      - Use for reference imagery or UI concepts; pass approved references into multi-view pipelines before 3D generation.
    comfyui_local:
      provider_id: comfyui_local
      display_name: ComfyUI Local
      asset_categories:
      - ui_hud
      - material
      output_formats:
      - png
      - tga
      runtime_kind: local_rtx3050
      checklist:
      - Use local workflows for remix, inpaint, upscale, and texture variation.
      - Preserve workflow or checkpoint notes in provenance.
      official_url: ''
      access_surface: Local RTX3050 ComfyUI workflows
      setup_steps: []
      progression_steps: []
      notes: []
    musicgen:
      provider_id: musicgen
      display_name: MusicGen
      asset_categories:
      - music
      output_formats:
      - wav
      - mp3
      - ogg
      runtime_kind: local_or_colab
      checklist:
      - Export at least one clean loopable cut and one longer variation.
      - Capture prompt, duration, seed, and model version in provenance.
      - Check for clipping and normalize to safe game levels before publish.
      official_url: https://github.com/facebookresearch/audiocraft
      access_surface: Local or Colab via AudioCraft MusicGen
      setup_steps:
      - Use the AudioCraft repo (MusicGen) for text-to-music generation.
      - Start with 20-40s clips and render a loopable segment for gameplay.
      progression_steps:
      - Lock tempo and instrumentation early (e.g., 90-120 BPM, no vocals).
      - Render multiple seeds, then pick the most stable loop.
      notes: []
    audioldm2:
      provider_id: audioldm2
      display_name: AudioLDM2
      asset_categories:
      - sfx
      - music
      output_formats:
      - wav
      runtime_kind: local_or_colab
      checklist:
      - Render 2-3 variations per SFX and keep the cleanest transient.
      - Capture prompt, duration, seed, and model version in provenance.
      - Trim silence and normalize levels before publish.
      official_url: https://github.com/haoheliu/AudioLDM2
      access_surface: Local or Colab via AudioLDM2
      setup_steps:
      - Use AudioLDM2 for text-to-audio SFX or ambience generation.
      - Prefer short 2-6s prompts for SFX and 10-20s for ambience beds.
      progression_steps:
      - Start with dry, single-source prompts; add environment later if needed.
      - Reject noisy or watery artifacts early and re-seed.
      notes: []
  ENGINE_BRIDGE_PROFILES:
    EngineBridgeKind.UNITY:
      engine: unity
      display_name: Unity Engine Bridge
      source_adapter: unity_engine_bridge
      export_formats:
      - glb
      - fbx
      - png
      - tga
      - wav
      import_notes:
      - Import the package into a throwaway Unity project, not the live game project.
      - Let Unity reimport fully before choosing export targets.
      - Skip editor tools, scripts, and package infrastructure unless they are required to reach the content.
      export_notes:
      - Export models and rigs to GLB or FBX.
      - Export textures to PNG or TGA.
      - Export audio to WAV when possible.
    EngineBridgeKind.UNREAL:
      engine: unreal
      display_name: Unreal Engine Bridge
      source_adapter: unreal_engine_bridge
      export_formats:
      - glb
      - fbx
      - png
      - tga
      - wav
      import_notes:
      - Import the package into a throwaway Unreal project or use owned Fab content in an isolated project.
      - Skip plugins and code-heavy packages by default.
      - Only bridge owned or licensed content.
      export_notes:
      - Export meshes and animations to FBX or GLB where available.
      - Export textures to PNG or TGA.
      - Export audio to WAV.
  DEFAULT_ASSET_TYPES:
  - models
  - animations
  - textures
  - audio
  DEFAULT_SKIP_TYPES:
  - plugins
  - editor_tools
  - code_heavy_packages
  EXTRACTOR_PROFILES:
    ExtractorTool.ASSET_RIPPER:
      tool: asset_ripper
      display_name: AssetRipper
      export_formats:
      - glb
      - fbx
      - png
      - wav
      notes:
      - Use for owned or licensed Unity content only.
      - Prefer when project reconstruction is useful.
    ExtractorTool.ASSET_STUDIO:
      tool: asset_studio
      display_name: AssetStudio
      export_formats:
      - fbx
      - obj
      - png
      - wav
      notes:
      - Use for owned or licensed Unity content only.
      - Prefer when targeting specific assets.
    ExtractorTool.FMODEL:
      tool: fmodel
      display_name: FModel
      export_formats:
      - glb
      - fbx
      - png
      - wav
      notes:
      - Use for owned or licensed Unreal content only.
      - Preferred modern Unreal extractor.
    ExtractorTool.UMODEL:
      tool: umodel
      display_name: Umodel
      export_formats:
      - glb
      - fbx
      - tga
      notes:
      - Use for owned or licensed Unreal content only.
      - Fallback extractor for older titles.
  STATIC_PROVIDER_RUNBOOKS:
    direct_url_lane:
      provider_id: direct_url_lane
      display_name: Direct URL Lane
      provider_family: lane
      lane: direct_url
      access_surface: Repo CLI queue and reviewed-packet flow
      official_url: ''
      setup_steps:
      - Confirm `print-provider-readiness --json` shows the direct lane as ready.
      - Prefer sources where the exact file URL and license page are already known.
      - Queue downloads through the shared queue instead of dropping raw files straight into Flax.
      progression_steps:
      - Acquire the source archive or files through the queue runner.
      - Validate the reviewed packet and provenance before Flax intake.
      - Use `print-pack-readiness --json` to confirm the pack moved from blocked to ready_reviewed.
      checklist:
      - Capture source page URL and exact file URL in provenance.
      - Keep filenames stable between download, cleanup, and payload handoff.
      - Use direct_url only when the source is truly direct-download friendly.
      notes: []
    fab:
      provider_id: fab
      display_name: Fab
      provider_family: manual_browser
      lane: manual_browser
      access_surface: Epic/Fab browser session plus reviewed packet flow
      official_url: https://www.fab.com/
      setup_steps:
      - Run `python scripts/cli.py asset-factory fab-auth --reuse-profile` first.
      - If there is no existing browser session, rerun with `--allow-browser` from a real interactive desktop terminal and
        complete the visible Epic/Fab login.
      - Keep the shared browser profile alive after login so later download jobs can reuse it.
      progression_steps:
      - Use `run-fab-batch` for deterministic listing intake and fallback job emission.
      - When a listing skips or fails direct download, execute the emitted browser job instead of improvising.
      - Register the reviewed packet and re-check `print-pack-readiness --json` before Flax intake.
      checklist:
      - Capture product page URL, seller, and license wording in provenance.
      - Prefer deterministic batch artifacts over ad-hoc downloads.
      - Treat Fab auth as shared browser state that other provider lanes may reuse.
      notes: []
    mixamo:
      provider_id: mixamo
      display_name: Mixamo
      provider_family: manual_browser
      lane: manual_browser
      access_surface: Adobe/Mixamo browser workflow
      official_url: https://www.mixamo.com/
      setup_steps:
      - Run `python scripts/cli.py asset-factory mixamo-auth --reuse-profile` first.
      - If the shared browser profile is empty, rerun with `--allow-browser` from a real interactive desktop terminal and
        finish the Adobe login in the visible window.
      - Keep the saved browser profile so animation acquisition does not require repeated sign-ins.
      progression_steps:
      - Acquire the character or animation clip through the browser/manual flow.
      - Preserve export settings, clip names, and source page URLs in provenance.
      - Move accepted files into cleanup before reviewed packet registration.
      checklist:
      - Record exact character/animation ids and export options.
      - Avoid mixing unrelated clips into one pack unless the pack plan explicitly calls for it.
      - Re-check readiness before assuming the saved session is still valid.
      notes: []
    unity_asset_store:
      provider_id: unity_asset_store
      display_name: Unity Asset Store
      provider_family: manual_browser
      lane: manual_browser
      access_surface: Unity Asset Store browser login plus local Unity export bridge
      official_url: https://assetstore.unity.com/
      setup_steps:
      - Run `python scripts/cli.py asset-factory unity-auth --reuse-profile` first.
      - If no shared browser state exists, rerun with `--allow-browser` from a real interactive desktop terminal and finish
        the Unity sign-in flow.
      - Confirm at least one usable Unity editor install is detected before planning large acquisition batches.
      progression_steps:
      - Acquire store packages through the browser/manual lane.
      - Push package extraction and export through the Unity bridge instead of unpacking ad-hoc.
      - Register the reviewed packet only after export outputs are staged and provenance is complete.
      checklist:
      - Capture package page, publisher, version, and archive name.
      - Do not treat Asset Store login alone as enough; the Unity export bridge must also be ready.
      - Prefer deterministic project-ingest or export jobs when a pack needs repeatability.
      notes: []
    unity_export_bridge:
      provider_id: unity_export_bridge
      display_name: Unity Export Bridge
      provider_family: engine_bridge
      lane: manual_browser
      access_surface: Local Unity editor installation
      official_url: ''
      setup_steps:
      - Install a supported Unity editor through Unity Hub or expose the editor path under the normal search roots.
      - Confirm `list-unity-installs` shows `usable=true` before planning export work.
      - Keep one clean export project ready for store package ingest and repeatable export runs.
      progression_steps:
      - Use the bridge job emitters instead of exporting assets manually.
      - Stage exported meshes, textures, and audio into the reviewed packet boundary.
      - Feed the reviewed payload into Flax only after cleanup and provenance validation.
      checklist:
      - Prefer one Unity install lane that stays stable for repeated exports.
      - Treat exported outputs as upstream artifacts, not final Flax truth until packet registration.
      notes: []
    unreal_export_bridge:
      provider_id: unreal_export_bridge
      display_name: Unreal Export Bridge
      provider_family: engine_bridge
      lane: manual_browser
      access_surface: Local Unreal editor command-line installation
      official_url: ''
      setup_steps:
      - Install a full Unreal editor build, not just launcher stubs or empty version folders.
      - Confirm `list-unreal-installs` shows a usable command path before planning Unreal export automation.
      - If a version root exists but no editor binaries are detected, repair or reinstall that Unreal version.
      progression_steps:
      - Emit Unreal export jobs instead of exporting by hand.
      - Use extraction tools only as fallbacks when the editor bridge is unavailable or too heavy for the pack.
      - Stage export outputs into cleanup and the reviewed packet boundary before Flax intake.
      checklist:
      - A detected Unreal version folder is not enough; `usable=true` is the real readiness gate.
      - Keep the project/export path deterministic so repeated runs stay comparable.
      notes: []
    epic_extraction:
      provider_id: epic_extraction
      display_name: Epic/Fab Extraction
      provider_family: extractor_bridge
      lane: manual_browser
      access_surface: FModel/UModel/CUE4Parse or compatible Unreal extraction helpers
      official_url: ''
      setup_steps:
      - Confirm `print-provider-readiness --json` shows extraction tools or a compatible Unreal path.
      - Keep Epic launcher cache and Fab library metadata intact when doing owned-library work.
      - Use extractor tooling only on assets you own and are authorized to process.
      progression_steps:
      - Map owned library state first, then emit deterministic extraction jobs.
      - Use extraction as a bridge into reviewed packets, not as a direct Flax import shortcut.
      - Prefer recorded extraction artifacts so later packs can be reproduced.
      checklist:
      - Capture source app/listing identity in provenance.
      - Keep extraction outputs separate from reviewed payload until cleanup finishes.
      notes: []
    legendary:
      provider_id: legendary
      display_name: Legendary Bridge
      provider_family: owned_library
      lane: manual_browser
      access_surface: Legendary CLI plus Epic launcher remember-me token
      official_url: ''
      setup_steps:
      - Install `legendary` and confirm the executable is discoverable.
      - Import Epic auth with `python scripts/cli.py asset-factory legendary-import-auth` if the session is missing.
      - Use `legendary-status` to confirm the account is visible before batch planning.
      progression_steps:
      - List owned Unreal assets first.
      - Install or bridge owned assets through deterministic job specs instead of ad-hoc launcher clicks.
      - Route extracted outputs through reviewed packets and cleanup before Flax intake.
      checklist:
      - Treat Legendary as an owned-library bridge, not a generic downloader.
      - Keep launcher auth healthy so later sync and install steps stay non-interactive.
      notes: []
    generator_profiles:
      provider_id: generator_profiles
      display_name: Generator Profiles
      provider_family: generator
      lane: generator
      access_surface: Colab profiles and local/cloud AI provider profiles
      official_url: ''
      setup_steps:
      - Use `print-provider-readiness --json` to see which generator profiles are available.
      - Pick one profile per pack and keep prompt provenance attached to that pack.
      - Do not mix generated outputs directly into Flax without reviewed packet registration.
      progression_steps:
      - Emit a generator setup batch for the chosen profile.
      - Review outputs, cleanup results, and provenance before publish.
      - Register the reviewed packet and verify readiness progression before Flax intake.
      checklist:
      - Capture prompt, profile/model, and seeds or session notes.
      - Treat generated outputs as upstream artifacts until the packet is validated.
      notes: []
